services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cekrir
      POSTGRES_PASSWORD: cekrir
      POSTGRES_DB: cekrir
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cekrir -d cekrir']
      interval: 2s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
