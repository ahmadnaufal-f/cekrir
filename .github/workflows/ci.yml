name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cekrir
          POSTGRES_PASSWORD: cekrir
          POSTGRES_DB: cekrir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cekrir -d cekrir_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://cekrir:cekrir@127.0.0.1:5432/cekrir
      TEST_DATABASE_URL: postgresql://cekrir:cekrir@127.0.0.1:5432/cekrir_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.13.6'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/backend --frozen
      - run: pnpm run db:test:deploy
      - run: pnpm run check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test
      - run: pnpm run build
