[platformio]
default_envs = xiao_esp32s3_sense

[env]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = -Wall -Wextra
build_src_filter = +<main.cpp>

[env:xiao_esp32s3_sense]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DCEKRIR_CAMERA_XIAO_S3

[env:ai_thinker_esp32cam]
board = esp32cam
build_flags = ${env.build_flags} -DCEKRIR_CAMERA_AI_THINKER

; Candidate pin map for the common dual-USB ESP32-S3 CAM N16R8 board.
; Confirm the board's camera wiring before using this profile.
[env:esp32_s3_cam]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DCEKRIR_CAMERA_ESP32_S3_CAM

[env:esp32_s3_cam_camera_check]
extends = env:esp32_s3_cam
build_src_filter = +<camera_check.cpp>

[env:esp32_s3_cam_wifi_camera]
extends = env:esp32_s3_cam
build_src_filter = +<wifi_camera.cpp>

[env:esp32_s3_cam_wifi_video]
extends = env:esp32_s3_cam_wifi_camera
build_flags = ${env:esp32_s3_cam.build_flags} -DCEKRIR_VIDEO_MODE

[env:esp32_s3_cam_buzzer_test]
extends = env:esp32_s3_cam
build_src_filter = +<buzzer_test.cpp>

[env:esp32_s3_cam_proximity_test]
extends = env:esp32_s3_cam
build_src_filter = +<proximity_test.cpp>

[env:native]
platform = native@1.2.1
framework =
lib_deps =
build_flags = -std=c++17 -Wall -Wextra -Werror
test_framework = unity
test_build_src = no
