info:
  name: "Create payment draft"
  type: http
  seq: 22

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payments"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Idempotency-Key
      value: "{{paymentIdempotencyKey}}"
  body:
    type: json
    data: |-
      {
        "reference": "test-order-001",
        "amount": 10000,
        "currency": "IDR"
      }

