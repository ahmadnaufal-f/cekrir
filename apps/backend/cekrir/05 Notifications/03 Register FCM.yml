info:
  name: Register FCM token
  type: http
  seq: 3
http:
  method: POST
  url: "{{baseUrl}}/api/v1/notifications/fcm"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {"location_id": "{{locationId}}", "token": "{{fcmToken}}"}
runtime:
  scripts:
    - type: tests
      code: |-
        test("Push device is registered without exposing its token", function () {
          expect(res.status).to.equal(200);
          expect(res.body).to.have.property("device_id");
          expect(res.body.location_id).to.equal(bru.getVar("locationId"));
          expect(res.body).not.to.have.property("token");
        });
docs:
  content: Register a real FCM token from the user's app; the authenticated user must belong to the location. Copy device_id to fcmDeviceId for the delete request.
  type: text/markdown
