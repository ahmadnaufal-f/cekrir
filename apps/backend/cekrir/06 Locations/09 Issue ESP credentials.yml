info:
  name: Issue or rotate ESP credentials
  type: http
  seq: 9
http:
  method: POST
  url: "{{baseUrl}}/api/v1/locations/{{locationId}}/esp/credentials"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns the device ID and a one-time key", function () {
          expect(res.status).to.equal(200);
          expect(res.body.device_id).to.be.a("string").and.not.empty;
          expect(res.body.device_key).to.be.a("string").and.not.empty;
        });
docs:
  content: This rotates the key and immediately stops the previously provisioned ESP from authenticating. Copy the returned device_key to a private deviceKey variable; the key is only shown once.
  type: text/markdown
