# Retain the usual project name after moving this file out of the repository root.
# Set COMPOSE_PROJECT_NAME to the original project name if it differs.
name: ${COMPOSE_PROJECT_NAME:-cekrir}

services:
  db:
    image: cekrir-stack:vm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cekrir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - vm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cekrir"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: cekrir-stack:vm
    user: cekrir
    working_dir: /tmp
    command: ["redis-server", "--dir", "/tmp"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: cekrir-stack:vm
    build:
      context: .
    user: cekrir
    # Starts the FastAPI app using Uvicorn. Migrations are run separately.
    command: ["uvicorn", "cekrir.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cekrir
      - CEKRIR_REDIS_URL=redis://redis:6379/0
      - CEKRIR_JWT_SECRET_KEY=${CEKRIR_JWT_SECRET_KEY:?Set CEKRIR_JWT_SECRET_KEY}
      - CEKRIR_INGEST_API_KEY=${CEKRIR_INGEST_API_KEY:?Set CEKRIR_INGEST_API_KEY}
      - CEKRIR_EMAIL_PROVIDER=${CEKRIR_EMAIL_PROVIDER:-smtp}
      - CEKRIR_RESEND_API_KEY
      - CEKRIR_RESEND_FROM
      - CEKRIR_VERIFICATION_URL
      - CEKRIR_SMTP_HOST
      - CEKRIR_SMTP_PORT
      - CEKRIR_SMTP_SECURITY
      - CEKRIR_SMTP_USERNAME
      - CEKRIR_SMTP_PASSWORD
      - CEKRIR_SMTP_FROM
      - CEKRIR_CORS_ORIGINS
      - CEKRIR_TRACKING_PROVIDER
      - CEKRIR_TRACKING_API_URL
      - CEKRIR_TRACKING_API_KEY
    ports:
      - "127.0.0.1:8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  vm_postgres_data:
